<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดสุขภาพ 8 วัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
:root{--bg:#F1F5F7;--surface:#FFFFFF;--ink:#13222D;--mute:#5E7080;--line:#DCE4E9;--move:#E08A1E;--sleep:#4A5BD4;--water:#0C93A3;--track:#E8EEF1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1A22;--surface:#16252F;--ink:#E7EEF2;--mute:#97A8B5;--line:#263A47;--move:#F0A64A;--sleep:#8E9BFF;--water:#4FC6D3;--track:#21343F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1A22;--surface:#16252F;--ink:#E7EEF2;--mute:#97A8B5;--line:#263A47;--move:#F0A64A;--sleep:#8E9BFF;--water:#4FC6D3;--track:#21343F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;line-height:1.6}
main{max-width:920px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 22px;font-size:.95rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.kpi{padding:18px 18px 16px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .l{color:var(--mute);font-size:.88rem}
.kpi .v{font-size:2rem;font-weight:700;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--mute);margin-left:4px}
.kpi .n{font-size:.82rem;color:var(--mute)}
.kpi i{display:block;width:26px;height:4px;border-radius:2px;margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:700}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.charts .panel{margin:0}
.charts svg{width:100%;height:auto;display:block}
.row{display:grid;grid-template-columns:96px 1fr 120px 64px 64px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.head{color:var(--mute);font-size:.82rem;padding-top:0}
.date b{display:block;font-weight:500}
.date span{color:var(--mute);font-size:.82rem}
.act{font-weight:500}
.act.rest{color:var(--mute);font-weight:400}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--move);border-radius:4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.min{text-align:right;font-variant-numeric:tabular-nums}
.foot{color:var(--mute);font-size:.82rem;margin-top:6px}
@media (max-width:700px){
.kpis{grid-template-columns:1fr 1fr}
.kpi:nth-child(3){border-left:0}
.kpi:nth-child(n+3){border-top:1px solid var(--line)}
.charts{grid-template-columns:1fr}
.row{grid-template-columns:70px 1fr 56px 52px;gap:8px}
.row .sl{display:none}
.head .sl{display:none}
}
</style>
</head>
<body>
<main>
<h1>แดชบอร์ดสุขภาพส่วนตัว</h1>
<p class="sub">ข้อมูล 8 วัน 10–17 พ.ย. · น้ำหนักตัว 104 กก.</p>

<section class="kpis" id="kpis"></section>

<section class="charts">
  <div class="panel"><h2>ชั่วโมงนอนต่อคืน</h2><div id="c1"></div></div>
  <div class="panel"><h2>ปริมาณน้ำต่อวัน</h2><div id="c2"></div></div>
</section>

<section class="panel" style="margin-top:18px">
  <h2>กิจกรรมแต่ละวัน</h2>
  <div class="row head"><span>วันที่</span><span>กิจกรรม</span><span class="num">เวลา (นาที)</span><span class="num">นอน</span><span class="num sl">น้ำ</span></div>
  <div id="list"></div>
  <p class="foot">วันพักไม่นับเป็นวันออกกำลังกาย และไม่รวมในเวลารวม</p>
</section>
</main>

<script>
var D=[
{d:"10 พ.ย.",w:"จันทร์",a:"วิ่ง",m:30,s:7.2,h:1.8},
{d:"11 พ.ย.",w:"อังคาร",a:"ปั่นจักรยาน",m:45,s:6.5,h:1.5},
{d:"12 พ.ย.",w:"พุธ",a:"เดินเร็ว",m:40,s:7.0,h:2.0},
{d:"13 พ.ย.",w:"พฤหัสบดี",a:"เวทเทรนนิ่ง",m:40,s:6.8,h:1.9},
{d:"14 พ.ย.",w:"ศุกร์",a:"พักผ่อน (เดินเล่นเบา ๆ 15 นาที)",m:0,s:7.5,h:2.1,rest:1},
{d:"15 พ.ย.",w:"เสาร์",a:"วิ่ง",m:35,s:7.8,h:2.2},
{d:"16 พ.ย.",w:"อาทิตย์",a:"ปั่นจักรยาน",m:60,s:8.0,h:2.3},
{d:"17 พ.ย.",w:"จันทร์",a:"เดินเร็ว",m:45,s:6.9,h:1.8}
];
var days=D.filter(function(x){return x.m>0}).length;
var tot=D.reduce(function(a,x){return a+x.m},0);
var sl=D.reduce(function(a,x){return a+x.s},0)/D.length;
var wa=D.reduce(function(a,x){return a+x.h},0)/D.length;
var th=Math.floor(tot/60),tm=tot%60;
function k(c,l,v,u,n){return '<div class="kpi"><i style="background:var(--'+c+')"></i><div class="l">'+l+'</div><div class="v">'+v+'<small>'+u+'</small></div><div class="n">'+n+'</div></div>'}
document.getElementById("kpis").innerHTML=
k("move","วันออกกำลังกาย",days,"จาก 8 วัน","พัก 1 วัน")+
k("move","เวลาออกกำลังกายรวม",th+" ชม. "+tm,"นาที","เฉลี่ย "+Math.round(tot/days)+" นาที/วันที่ออก")+
k("sleep","นอนเฉลี่ย",sl.toFixed(1),"ชม./คืน","เป้าหมาย 7 ชม.")+
k("water","น้ำเฉลี่ย",wa.toFixed(2),"ลิตร/วัน","เป้าหมาย 2 ลิตร");

document.getElementById("list").innerHTML=D.map(function(x){
return '<div class="row"><div class="date"><b>'+x.d+'</b><span>'+x.w+'</span></div>'+
'<div><div class="act'+(x.rest?' rest':'')+'">'+x.a+'</div><div class="bar"><i style="width:'+(x.m/60*100)+'%"></i></div></div>'+
'<div class="min">'+(x.m?x.m:'พัก')+'</div><div class="num">'+x.s.toFixed(1)+' ชม.</div><div class="num sl">'+x.h.toFixed(1)+' ล.</div></div>'}).join("");

function chart(id,key,min,max,goal,color,unit,dec){
var W=420,H=230,L=36,R=14,T=22,B=40,w=W-L-R,h=H-T-B,n=D.length;
function X(i){return L+i*w/(n-1)}
function Y(v){return T+h-(v-min)/(max-min)*h}
var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟแนวโน้ม">';
var step=(max-min)/4;
for(var g=0;g<=4;g++){var v=min+g*step,y=Y(v);
s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>';
s+='<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+v.toFixed(dec?1:0)+'</text>'}
var gy=Y(goal);
s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="'+color+'" stroke-dasharray="5 4" opacity=".7"/>';
s+='<text x="'+(W-R)+'" y="'+(gy-5)+'" text-anchor="end" font-size="11" fill="'+color+'">เป้าหมาย '+goal+' '+unit+'</text>';
var pts=D.map(function(x,i){return X(i)+','+Y(x[key])}).join(' ');
s+='<polygon points="'+X(0)+','+(T+h)+' '+pts+' '+X(n-1)+','+(T+h)+'" fill="'+color+'" opacity=".12"/>';
s+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
D.forEach(function(x,i){
s+='<circle cx="'+X(i)+'" cy="'+Y(x[key])+'" r="4" fill="var(--surface)" stroke="'+color+'" stroke-width="2.5"/>';
s+='<text x="'+X(i)+'" y="'+(Y(x[key])-10)+'" text-anchor="middle" font-size="11" font-weight="500" fill="var(--ink)">'+x[key].toFixed(1)+'</text>';
s+='<text x="'+X(i)+'" y="'+(H-20)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+x.d.split(" ")[0]+'</text>';
});
s+='<text x="'+(L+w/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="11" fill="var(--mute)">วันที่ (พ.ย.)</text></svg>';
document.getElementById(id).innerHTML=s}
chart("c1","s",5,9,7,"var(--sleep)","ชม.",0);
chart("c2","h",1,3,2,"var(--water)","ล.",1);
</script>
</body>
</html>
